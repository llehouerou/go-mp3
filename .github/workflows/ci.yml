name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # mpg123: reference decoder for compliance tests; libasound2-dev: cgo dep of example/ (oto).
      - run: sudo apt-get update && sudo apt-get install -y mpg123 libasound2-dev
      - uses: golangci/golangci-lint-action@v8
      - run: make test
